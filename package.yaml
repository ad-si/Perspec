name: perspec
version: 1.2.0.0
github: ad-si/Perspec
license-file: license
author: Adrian Sieber
maintainer: mail@adriansieber.com
copyright: Adrian Sieber

extra-source-files:
  - readme.md
  - changelog.md

synopsis: Scan documents and books with as little hardware as possible.
category: Scan

description: |
  Please see the readme on GitHub at <https://github.com/ad-si/Perspec#readme>

language: GHC2021

dependencies:
  - aeson >= 2.2 && < 2.3
  - base >= 4.7 && < 5
  - bmp >= 1.2 && < 1.3
  - brillo >= 2.0 && < 2.1
  - brillo-juicy >= 0.3 && < 0.4
  - brillo-rendering >= 2.1 && < 2.2
  - bytestring >= 0.11 && < 0.13
  - Color >= 0.4 && < 0.5
  - directory >= 1.3 && < 1.4
  - docopt >= 0.7 && < 0.8
  - file-embed >= 0.0.16 && < 0.1
  - filepath >= 1.4 && < 1.6
  - flatcv >= 0.3 && < 0.4
  # The massiv based 2.x API is only available via the GitHub repository,
  # as the latest version on Hackage is still 1.5
  - hip >= 2.0 && < 2.1
  - hmatrix >= 0.20 && < 0.21
  - JuicyPixels >= 3.3 && < 3.4
  - lens >= 5.2 && < 5.4
  - linear >= 1.22 && < 1.24
  - massiv >= 1.0 && < 1.1
  - massiv-io >= 1.0 && < 1.1
  - natural-sort >= 0.1 && < 0.2
  - optparse-applicative >= 0.18 && < 0.20
  - process >= 1.6 && < 1.7
  - protolude >= 0.3 && < 0.4
  - text >= 2.0 && < 2.2
  - vector >= 0.13 && < 0.14
  - yaml >= 0.11 && < 0.12
  - zlib >= 0.6 && < 0.8

default-extensions:
  - DuplicateRecordFields
  - LambdaCase
  - NoImplicitPrelude
  - OverloadedRecordDot
  - OverloadedStrings
  - RecordWildCards
  - TemplateHaskell

ghc-options:
  - -Wall
  - -Wcompat
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wredundant-constraints
  - -fno-warn-orphans

library:
  source-dirs: source

executables:
  perspec:
    main: Main.hs
    source-dirs: app
    other-modules: []
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - perspec

  # Windowed GUI launcher (the `pythonw.exe` pattern):
  # on Windows it's linked with the GUI subsystem,
  # so double-clicking it doesn't open a console window next to the app.
  perspecw:
    main: GuiMain.hs
    source-dirs: app
    other-modules: []
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - perspec
    when:
      - condition: os(windows)
        ghc-options:
          - -optl-mwindows

tests:
  perspec-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - hspec >= 2.11 && < 2.12
      - perspec
      - temporary >= 1.3 && < 1.4
